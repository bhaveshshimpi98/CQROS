[project]
name = "cqros"
version = "0.1.0"
description = "Cryptocurrency Quantitative Research Operating System"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Bhavesh Shimpi" }
]

dependencies = [
    "catboost>=1.2.0",
    "httpx>=0.28.1",
    "lightgbm>=4.0.0",
    "polars>=1.43.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.18.0",
    "xgboost>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "N",
    "B",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
